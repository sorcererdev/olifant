description = "Model, migration, test and fixture (like `rails g model`)"
language = "ruby"
version = 1

[inputs.name]
type = "ident"
prompt = "Model name (singular)"

[inputs.fields]
type = "list"
optional = true
prompt = "Fields as name:type, comma separated"
of = [
  { name = "name", type = "ident" },
  { name = "type", type = "enum", choices = ["string", "text", "integer", "boolean", "references"], default = "string" },
]

[inputs.rails_version]  # GAP: Rails reads this from the app; needs a query (step 2)
type = "text"
default = "8.0"

[derive]
Model = "{= name|pascal =}"
table = "{= name|plural|snake =}"

[[edits]]
create = "db/migrate/{= now|timestamp =}_create_{= table =}.rb"
template = "migration.rb.dt"

[[edits]]
create = "app/models/{= name|snake =}.rb"
template = "model.rb.dt"

[[edits]]
create = "test/models/{= name|snake =}_test.rb"
template = "model_test.rb.dt"

[[edits]]
create = "test/fixtures/{= table =}.yml"
template = "fixtures.yml.dt"
