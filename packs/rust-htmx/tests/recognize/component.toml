use rscx::{component, html, props};

#[props]
pub struct BadgeProps {
    #[builder(setter(into))]
    label: String,
}

#[component]
pub fn Badge(props: BadgeProps) -> String {
    html! {
        <span class="rounded bg-gray-100 px-2">{props.label}</span>
    }
}
