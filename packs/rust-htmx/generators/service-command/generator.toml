description = "Add a command (use case) to an existing service"
language = "rust"
version = 1
examples = [
  "olifant gen rust-htmx/service-command --set service=billing --set command_name=cancel_subscription",
]

[inputs.service]
type = "ident"   # enum + choices_from in step 2

[inputs.command_name]
type = "ident"

[derive]
service_dir = "{= service|kebab =}/{= service|kebab =}-service"
Cmd = "{= command_name|pascal =}"
cmd = "{= command_name|snake =}"

[requires]
exists = ["{= service_dir =}/src/service.rs"]
hint = "Create the service first: olifant gen rust-htmx/service-skeleton --set service={= service =}"

[[edits]]
create   = "{= service_dir =}/src/{= cmd =}.rs"
exemplar = "fixture:billing/billing-service/src/refund_invoice.rs"
bind     = { command_name = "refund_invoice" }

[[edits]]
insert = "{= service_dir =}/src/lib.rs"
at     = "after last line matching ^pub mod "
text   = "pub mod {= cmd =};"

[[edits]]
insert = "{= service_dir =}/src/service.rs"
at     = "end of crate imports"
text   = "{= cmd =}::{{= Cmd =}, {= Cmd =}Input, {= Cmd =}Output},"

[[edits]]
insert = "{= service_dir =}/src/service.rs"
at     = "end of struct {= service|pascal =}Service"
text   = "pub {= cmd =}: {= Cmd =},"

[[edits]]
insert = "{= service_dir =}/src/service.rs"
at     = "end of literal in new"
text   = "{= cmd =}: {= Cmd =} {},"

[[edits]]
insert   = "{= service_dir =}/src/service.rs"
at       = "end of impl {= service|pascal =}Service"
template = "delegate.rs.dt"
