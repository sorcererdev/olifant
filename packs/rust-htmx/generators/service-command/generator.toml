name = "Add Command to Service"
description = "Add a command (use case) to an existing service"
language = "rust"
version = 1
examples = [
  "olifant gen rust-htmx/service-command --set service=billing --set command_name=cancel_subscription",
]

[inputs.service]
type = "enum"
one_of = "services"
prompt = "The service to add the command to"

[inputs.command_name]
type = "ident"

[derive]
service_dir = "{= service|kebab =}/{= service|kebab =}-service"
Cmd = "{= command_name|pascal =}"
cmd = "{= command_name|snake =}"

# Every service: folders like billing/billing-service. The choice is the
# parent folder's name (billing).
[query.services]
glob  = "*/*-service"
value = "parent folder"

[requires]
exists = ["{= service_dir =}/src/service.rs"]
hint = "Create the service first: olifant gen rust-htmx/service-skeleton --set service={= service =}"

# The template's own command (plop-templates/service-command), converted.
[[edits]]
create   = "{= service_dir =}/src/{= cmd =}.rs"
template = "command.rs.dt"

# The `pub mod` line comes from the pack's owned region (regions.toml), refreshed after every gen.

# Structure first; a service fresh from service-skeleton has no commands yet
# (empty struct, empty `use` list), so the template's hook comments are the
# fallback.
[[edits]]
insert = "{= service_dir =}/src/service.rs"
at     = ["end of crate imports", "after marker //##PLOP INSERT COMMAND IMPORTS HOOK##"]
text   = "{= cmd =}::{{= Cmd =}, {= Cmd =}Input, {= Cmd =}Output},"

[[edits]]
insert = "{= service_dir =}/src/service.rs"
at     = ["end of struct {= service|pascal =}Service", "after marker //##PLOP INSERT COMMAND HOOK##"]
text   = "pub {= cmd =}: {= Cmd =},"

[[edits]]
insert = "{= service_dir =}/src/service.rs"
at     = ["end of literal in new", "after marker //##PLOP INSERT COMMAND INSTANTIATION HOOK##"]
text   = """
{= cmd =}: {= Cmd =} {
    // Add any dependencies for the command here. They should be passed into this function and supplied by main.rs.
},"""

[[edits]]
insert   = "{= service_dir =}/src/service.rs"
at       = ["end of impl {= service|pascal =}Service", "after marker //##PLOP INSERT DELEGATE HOOK##"]
template = "delegate.rs.dt"
