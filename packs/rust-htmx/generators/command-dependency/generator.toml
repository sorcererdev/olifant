name = "Add Command Dependency"
description = "Add one dependency (a port) to a command: the command, the service's new() and main.rs (spec §7.1)"
summary = "A command takes a port: the command, new(), main.rs"
language = "rust"
version = 1
examples = [
  "olifant gen rust-htmx/command-dependency --set service=billing --set command=refund_invoice --set dependency=invoice_repository",
]

[inputs.service]
type = "enum"
one_of = "services"
prompt = "The service the command belongs to"

[inputs.command]
type = "enum"
one_of = "commands"
prompt = "The command (use case) that needs the dependency"

[inputs.dependency]
type = "enum"
one_of = "ports"
prompt = "The port it depends on (a file in the service's ports/)"

[derive]
service_dir = "{= service|kebab =}/{= service|kebab =}-service"
svc = "{= service|snake =}_service"
Svc = "{= service|pascal =}Service"
cmd = "{= command|snake =}"
Cmd = "{= command|pascal =}"
d = "{= dependency|snake =}"
D = "{= dependency|pascal =}"

# Every service: folders like billing/billing-service. The choice is the
# parent folder's name (billing).
[query.services]
glob  = "*/*-service"
value = "parent folder"

# The chosen service's commands: its src/*.rs files, less the service's own modules.
[query.commands]
glob    = "{= service_dir =}/src/*.rs"
exclude = ["**/lib.rs", "**/service.rs", "**/models.rs", "**/ports.rs"]
value   = "file name"

# The chosen service's ports.
[query.ports]
glob  = "{= service_dir =}/src/ports/*.rs"
value = "file name"

[requires]
exists = ["{= service_dir =}/src/{= cmd =}.rs", "{= service_dir =}/src/ports/{= d =}.rs", "main/src/main.rs"]
hint = "The port must exist (olifant gen rust-htmx/service-repository …) and main.rs must construct the service (service-skeleton does)."

# Each edit is skipped when its text is already there by name, however it is
# spelled or wherever it sits (`unless.matches`): a field or import added by
# hand, an import grouped as `use crate::ports::{a::A, b::B}`, a let whose
# todo!() has become a real adapter. Commented-out lines (the command
# template's `// use crate::ports::worksite_repository::…` hint) do not count.

# 1-2: the command
[[edits]]
insert = "{= service_dir =}/src/{= cmd =}.rs"
at     = "end of struct {= Cmd =}"
text   = "pub {= d =}: Arc<dyn {= D =}>,"
unless = { matches = "^[[:space:]]*pub {= d =}[[:space:]]*:" }

[[edits]]
insert = "{= service_dir =}/src/{= cmd =}.rs"
at     = ["end of imports", "start of file"]
text   = "use crate::ports::{= d =}::{= D =};"
unless = { matches = "^[^/]*{= d =}::{= D =}([^[:alnum:]_]|$)" }

# 3-5: the service
[[edits]]
insert = "{= service_dir =}/src/service.rs"
at     = ["end of imports", "start of file"]
text   = "use crate::ports::{= d =}::{= D =};"
unless = { matches = "^[^/]*{= d =}::{= D =}([^[:alnum:]_]|$)" }

[[edits]]
insert = "{= service_dir =}/src/service.rs"
at     = "end of parameters in new"
text   = "{= d =}: Arc<dyn {= D =}>,"

[[edits]]
insert = "{= service_dir =}/src/service.rs"
at     = "end of literal {= Cmd =} in new"
text   = "{= d =}: {= d =}.clone(),"

# 6-7: main.rs (choosing the adapter is the creative part: a todo!)
[[edits]]
insert = "main/src/main.rs"
at     = "before first line matching ^[[:space:]]*let (mut )?{= svc =} = "
text   = "let {= d =}: Arc<dyn {= svc =}::ports::{= d =}::{= D =}> = todo!(\"an adapter for {= D =}\");"
unless = { matches = "^[[:space:]]*let (mut )?{= d =}[[:space:]]*[:=]" }

[[edits]]
insert = "main/src/main.rs"
at     = "end of call {= svc =}::service::{= Svc =}::new in main"
text   = "{= d =}.clone(),"
