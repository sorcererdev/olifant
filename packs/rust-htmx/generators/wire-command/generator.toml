description = "Wire a command's dependencies after you add fields to its struct by hand (spec §7.1: reconcile)"
language = "rust"
version = 1
examples = [
  "olifant gen rust-htmx/wire-command --set service=billing --set command=cancel_invoice",
]

[inputs.service]
type = "enum"
one_of = "services"

[inputs.command]
type = "enum"
one_of = "commands"

[derive]
service_dir = "{= service|kebab =}/{= service|kebab =}-service"

# Every service: folders like billing/billing-service. The choice is the
# parent folder's name (billing).
[query.services]
glob  = "*/*-service"
value = "parent folder"

# The chosen service's commands: its src/*.rs files, less the service's own modules.
[query.commands]
glob    = "{= service_dir =}/src/*.rs"
exclude = ["**/lib.rs", "**/service.rs", "**/models.rs", "**/ports.rs"]
value   = "file name"

[query.deps]
files    = "{= service_dir =}/src/{= command|snake =}.rs"
items_of = "struct {= command|pascal =}"
each     = { name = "^pub ([a-z_0-9]+):" }

[[uses]]
generator = "command-dependency"
for_each  = "deps"
with      = { service = "{= service =}", command = "{= command =}", dependency = "{= item.name =}" }

# In an editor (olifant actions): on a field of the command's struct.
[applies_at]
path  = "{service}/*-service/src/{command}.rs"
node  = { kind = "field_declaration", inside = { kind = "struct_item", regex = "^pub struct {= command|pascal =} ", stopBy = "end" } }
where = "on a field of the {= command|pascal =} struct"
label = "Wire {= command =}'s dependencies"
