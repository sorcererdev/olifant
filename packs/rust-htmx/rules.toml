# Conventions that hold themselves (spec §5.9). Rules warn and offer a fix;
# they never edit code. Silence one place with
#   // olifant:allow RULE — reason
# or a whole file with `// olifant:allow-file RULE — reason` in its first lines;
# a project can change severities or allow paths under [rules] in
# .olifant/config.toml. `olifant check --report` lists every exception.

[rules.commands-use-ports]
files    = "{service}/*-service/src/*.rs"
exclude  = ["**/lib.rs", "**/service.rs", "**/models.rs", "**/ports.rs"]
# Any Diesel in a command: an import, a `diesel::` path, or a schema table
# (`invoices::table`) — so it fires wherever you start, even before the
# import exists. One finding per line (nested matches count once).
match    = { any = [
  { kind = "use_declaration", regex = "diesel" },
  { kind = "scoped_identifier", regex = "^diesel::" },
  { kind = "scoped_identifier", regex = "::(table|dsl)$" },
] }
message  = "Commands talk to ports, not the database (rust-htmx: ports & adapters)"
severity = "warn"

# The usual answer first: the port this service already has for that data.
[[rules.commands-use-ports.fixes]]
generator = "rust-htmx/command-dependency"
label     = "Use an existing port"
with      = { service = "{= service =}", command = "{= stem =}" }

[[rules.commands-use-ports.fixes]]
generator = "rust-htmx/service-repository"
label     = "Add a new repository port"
with      = { service = "{= service =}" }

[rules.commands-no-unwrap]
files    = "*/*-service/src/*.rs"
exclude  = ["**/lib.rs", "**/service.rs", "**/models.rs", "**/ports.rs"]
match    = { kind = "call_expression", regex = "\\.unwrap\\(\\)$" }
message  = "Commands return their Failure, they don't panic (use ? and a Failure variant)"
severity = "hint"
