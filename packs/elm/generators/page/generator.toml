description = "A page in the Elm architecture (Model/Msg/init/update/view), wired into Main and Route like elm-spa-example"
language = "elm"
version = 1
examples = [
  "olifant gen elm/page --set page=settings --set msgs=\"toggle_dark_mode, set_display_name:String\"",
  "olifant gen elm/page --set page=settings + elm/page --set page=profile --set msgs=\"follow, got_bio:String\"",
]

[inputs.page]
type = "ident"
prompt = "Page name (e.g. counter, article_list)"

[derive]
P = "{= page|pascal =}"

[requires]
exists = ["src/Main.elm", "src/Route.elm"]
hint = "This pack expects an elm-spa-example style app with src/Main.elm and src/Route.elm."

[[edits]]
create   = "src/Page/{= P =}.elm"
exemplar = "fixture:src/Page/SamplePage.elm"
bind     = { page = "sample_page" }

[[edits]]
insert = "src/Main.elm"
at     = "after last line matching ^import Page\\."
text   = "import Page.{= P =} as {= P =}"

[[edits]]
insert = "src/Main.elm"
at     = "end of type Page"
text   = "| {= P =} {= P =}.Model"

[[edits]]
insert = "src/Main.elm"
at     = "end of type Msg"
text   = "| Got{= P =}Msg {= P =}.Msg"

# The branch is copied from the fixture's real `update` (a fragment), so it
# cannot drift from the app's style; the blank line before it comes from the
# spacing between the existing branches.
[[edits]]
insert   = "src/Main.elm"
at       = "end of case in update"
fragment = { file = "fixture:src/Main.elm", items_of = "case in update", matching = "GotSamplePageMsg" }
bind     = { page = "sample_page" }

[[edits]]
insert = "src/Route.elm"
at     = "end of type Route"
text   = "| {= P =}"

[[edits]]
insert = "src/Route.elm"
at     = "end of list in parser"
text   = ', Parser.map {= P =} (s "{= page|kebab =}")'

[[edits]]
complete = "Route.{= P =}"
where    = "case in changeRouteTo"
text     = """
{= pattern =} ->
    {= P =}.init |> updateWith {= P =} Got{= P =}Msg model"""

[[edits]]
complete = "Main.{= P =}"
where    = "case in view"
text     = """
{= P =} page ->
    viewPage Got{= P =}Msg ({= P =}.view page)"""

[inputs.msgs]
type = "list"
optional = true
prompt = "Messages to add to the page, as name or name:PayloadType, comma separated (e.g. toggle_dark_mode, set_display_name:String)"
of = [
  { name = "name", type = "ident" },
  { name = "arg", type = "text", default = "" },
]

[[uses]]
generator = "msg"
for_each  = "msgs"
with      = { page = "{= page =}", msg = "{= item.name =}", arg = "{= item.arg =}" }
