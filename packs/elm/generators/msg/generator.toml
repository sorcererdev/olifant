description = "A new Msg for an Elm page: the variant plus an update branch returning ( model, Cmd.none )"
language = "elm"
version = 1
examples = [
  "olifant gen elm/msg --set page=settings --set msg=reset",
  "olifant gen elm/msg --set page=article_list --set msg=got_articles --set arg=\"List String\"",
]

[inputs.page]
type = "ident"
prompt = "Existing page (e.g. counter)"

[inputs.msg]
type = "ident"
prompt = "Message name (e.g. increment_by, clicked_save)"

[inputs.arg]
type = "text"
optional = true
prompt = "Payload type, if any (e.g. Int, String, (Result Http.Error Article))"

[derive]
Msg = "{= msg|pascal =}"

[requires]
exists = ["src/Page/{= page|pascal =}.elm"]
hint = "Create the page first: olifant gen elm/page --set page={= page =}"

[[edits]]
insert = "src/Page/{= page|pascal =}.elm"
at     = "end of type Msg"
text   = "| {= Msg =}{= if arg =} {= arg|parens =}{= end =}"

[[edits]]
complete = "{= Msg =}"
where    = "case in update"
text     = """
{= pattern =} ->
    ( model, Cmd.none )"""
