# command, own way (from the spike, 2026-10-06)
path   = "src/bistro/booking/commands/close_table.py"
expect = "command"
band   = "offer"
inputs = { app = "bistro", service = "booking", command = "close_table" }
text = '''
class CloseTable:
    def __init__(self, repo):
        self.repo = repo

    def run(self, table_id):
        table = self.repo.table(table_id)
        table.closed = True
        self.repo.save(table)
'''
