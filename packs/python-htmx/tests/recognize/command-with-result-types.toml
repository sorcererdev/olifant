# command, with result types (from the spike, 2026-10-06)
path   = "src/bistro/booking/commands/seat_party.py"
expect = "command"
band   = "offer"
inputs = { app = "bistro", service = "booking", command = "seat_party" }
text = '''
from dataclasses import dataclass
from bistro.shared.result import Ok

@dataclass(frozen=True)
class SeatPartyInput:
    booking_id: str

class SeatParty:
    def __init__(self, bookings) -> None:
        self.bookings = bookings

    def handle(self, input: SeatPartyInput):
        booking = self.bookings.get(input.booking_id)
        return Ok(booking)
'''
