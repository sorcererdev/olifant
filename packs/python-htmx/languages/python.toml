# Over the shipped python.toml: only what this pack's convention changes.
# A module's tests live beside it as NAME__test.py.
[test]
tests_for = "{= dir =}/{= stem =}__test.py"

# How conjure reads this pack's architecture (book chapter 09, `[conjure]`):
# a service is `src/<app>/<service>`; its ports are Protocol classes under
# `ports/`. A test's fakes and a command's constructor are read from a sibling
# test (one that already builds a command with a port's fake), so there is no
# `[conjure.fake]` or `[conjure.constructor]` here: chapter 9 has them as a
# recipe for a service's first test, to delete once a sibling test exists.
[conjure]
service = "src/{= app =}/{= service =}"

[conjure.port]
files = ["ports/**/*.py"]
start = '^class ([[:alnum:]_]+)\(Protocol\):'
method = '^def '
# A method a port lacks: port-method writes it into the Protocol (a snippet
# whose holes are name, params, returns), then port-method-adapters adds it
# to every adapter beside it, with a red contract test.
add = "port-method"
adapters = "port-method-adapters"

# A test file whose stub has the `command()` (or `query()`) helper: the
# model writing a test's body is told to build it through the helper.
[[conjure.advice]]
when = '^def command\('
say = "build the command with the helper, passing the adapters you arranged (`command(booking_repository=repository)`); never call the helper bare after arranging a repository"

[[conjure.advice]]
when = '^def query\('
say = "build the query with the helper, passing the adapters you arranged (`query(booking_repository=repository)`); never call the helper bare after arranging a repository"

