# Python: ast-grep's built-in grammar; checks with pyright (strict, from the
# project's pyproject.toml) through uv, its venv in Olifant's cache: one per
# project and lockfile ({= context =}). The project is an app, not a package
# (`[tool.uv] package = false`): nothing is built; pyright finds src/.
files = ["**/*.py"]
# What a unit is, as prompts say it (an anchor @path:Unit).
unit_words = "a top-level class or function name (Name) or a method (Class.method)"
# Reserved words: recognition keeps them as they are (names become their case shape)
keywords = ["False", "None", "True", "and", "as", "assert", "async", "await", "break", "class", "continue", "def", "del", "elif", "else", "except", "finally", "for", "from", "global", "if", "import", "in", "is", "lambda", "match", "case", "nonlocal", "not", "or", "pass", "raise", "return", "try", "type", "while", "with", "yield", "self", "cls"]
# The unit (`conjure`, `stub`): the innermost of these node kinds at the cursor
unit = { kinds = ["function_definition", "class_definition", "decorated_definition"], name = ['^[[:space:]]*(async[[:space:]]+)?(def|class)[[:space:]]+([^[:space:](:[]+)'] }
comment = "#"
grammar = "python"
indent = "    "
# A block opens at a line ending in `:`; `pass` is the statement that does nothing.
opens_block = ':[[:space:]]*(#.*)?$'
empty_statement = "pass"
# A body still a stub: each stripped line one of these (a comment and a hole's line count too).
stub_lines = ['^\.\.\.$', '^pass$', '^assert \.\.\.$', '^raise NotImplementedError']
# Items in brackets end with a comma; an item joins a one-line container inline
# while the line stays within 88 (Black's and Ruff's), else one item per line.
separator = ","
line_length = 88
placeholder = 'raise NotImplementedError("{= message|python_string =}")'
branch = "case {= pattern =}:\n    {= body =}"
# Imports. `line`: a fill may begin with import lines (a decode needing
# `date`): they join the file's imports. `write`: how a test imports a unit
# (a method's class). `module_of`: a path's module (`src/` stripped,
# `__init__` dropped, dotted). `resolve` and `paths`: the project files an
# import names (a conjure's context): `from a.b import x, y` names `a.b`,
# `a.b.x` and `a.b.y`; `import a.b, c` names `a.b` and `c`.
[imports]
line = "^(from [A-Za-z0-9_.]+ import \\(?[A-Za-z0-9_., ]+\\)?|import [A-Za-z0-9_.]+( as [A-Za-z0-9_]+)?)$"
write = "from {= module =} import {= owner =}"
module_of = { strip = ["^src/"], drop = ["__init__"], separator = "." }
paths = ["src/{= path =}.py", "src/{= path =}/__init__.py"]
# What the model is shown: a fill that needs a name starts with its import.
example = { needs = "date", fill = "from datetime import date\n\ndate.fromisoformat(text)" }
# A blank line between imports groups them: `end of imports` joins the last
# import with none. In a file with none, the first goes under the docstring.
spaced = false
when_empty = "after header"

[[imports.resolve]]
pattern = '^from ([^.].*) import (.*)$'
module = 1
names = 2

[[imports.resolve]]
pattern = '^import (.*)$'
module = 1

# `from datetime import time` joins `from datetime import date`: one line
# per module.
[import_merge]
pattern = "^from ([A-Za-z0-9_.]+) import \\(?([A-Za-z0-9_, ]+)\\)?$"
write   = "from {= module =} import {= names =}"

[check]
preset = "pyright"
# Tests: pytest through uv (a module's tests beside it as test_NAME.py,
# unless a pack or the project says otherwise). A test's assertion starts
# at its first `assert` statement.
[test]
preset = "pytest"
assertion = ['^[[:space:]]*assert([[:space:]]|\(|$)']

# Hole kinds (spec §6.3). An expression placeholder is typed Any (getattr's
# result), so it fits any type under pyright strict and needs no import; it
# raises with the hole's message if it is ever run. Not Never: pyright skips
# code after a Never as unreachable, which would leave a later fill unchecked.
[holes.expr]
placeholder = 'getattr(NotImplemented, "olifant: {= hole =}: {= instruction|python_string =}")'
wrap = "def __olifant():\n    return {= fill =}"

[holes.stmt]
placeholder = 'raise NotImplementedError("olifant: {= hole =}: {= instruction|python_string =}")'
wrap = "def __olifant():\n{= fill|indent =}"

[holes.block]
placeholder = 'raise NotImplementedError("olifant: {= hole =}: {= instruction|python_string =}")'
wrap = "def __olifant():\n{= fill|indent =}"

# Tab stops in snippets (spec §4.9): a name, or text inside a string.
[holes.ident]
placeholder = "{= hole =}"
wrap = "class {= fill =}: ..."

[holes.text]
placeholder = "{= hole =}"
wrap = "__olifant = \"{= fill =}\""

# A failure union, one member per line (`type F = (\n    A\n    | B\n)`):
# `end of union F` adds a line after the last member.
[targets.union]
phrase = "union NAME"
container = { kind = "parenthesized_expression", inside = { kind = "type_alias_statement", has = { field = "left", regex = "^{= NAME =}$" }, stopBy = "end" } }
# The whole union is the one item (`A | B | C`, or a lone `A`): `end of`
# goes after its last line, at its indentation.
items = { any = [{ kind = "binary_operator" }, { kind = "identifier" }] }
example = "end of union CreateBookingFailure"
# members are joined by `|`, not a separator: a one-line union never grows
separator = ""

[targets.match_on]
phrase = "match on NAME"
container = { kind = "block", inside = { kind = "match_statement", has = { field = "subject", regex = "^{= NAME =}$" } } }
items = { kind = "case_clause" }
example = "end of match on failure"

# `class NAME`, `function NAME`, `call NAME [in FUNCTION]`, `parameters in
# FUNCTION` and `imports` are the generic phrases (library/queries/python).

# Mutation operators (`mutate`): what a test of Python code must notice.
# Boundaries
[[mutate]]
name = "boundary"
pattern = "$A < $B"
fix = "$A <= $B"
[[mutate]]
name = "boundary"
pattern = "$A <= $B"
fix = "$A < $B"
[[mutate]]
name = "boundary"
pattern = "$A > $B"
fix = "$A >= $B"
[[mutate]]
name = "boundary"
pattern = "$A >= $B"
fix = "$A > $B"
# Equality
[[mutate]]
name = "equality"
pattern = "$A == $B"
fix = "$A != $B"
[[mutate]]
name = "equality"
pattern = "$A != $B"
fix = "$A == $B"
# Negation
[[mutate]]
name = "negate"
pattern = "$A is None"
fix = "$A is not None"
[[mutate]]
name = "negate"
pattern = "$A is not None"
fix = "$A is None"
[[mutate]]
name = "negate"
pattern = "not $A"
fix = "$A"
# and/or
[[mutate]]
name = "and-or"
pattern = "$A and $B"
fix = "$A or $B"
[[mutate]]
name = "and-or"
pattern = "$A or $B"
fix = "$A and $B"
# Arithmetic
[[mutate]]
name = "arith"
pattern = "$A + $B"
fix = "$A - $B"
[[mutate]]
name = "arith"
pattern = "$A - $B"
fix = "$A + $B"
# A return's value
[[mutate]]
name = "return-none"
pattern = "return $X"
fix = "return None"
# A call statement
[[mutate]]
name = "delete-call"
rule = { kind = "expression_statement", has = { kind = "call" } }
fix = "pass"
# Strings, but not one in a statement of its own (a docstring)
[[mutate]]
name = "string"
rule = { kind = "string", not = { inside = { kind = "expression_statement" } } }
fix = '""'
# Integers
[[mutate]]
name = "number"
rule = { kind = "integer" }
transform = "increment"

# What a new port method's signature is made of (conjure adding a method a
# test calls): literal types, declarations, a result that may be None.
[types]
string = "str"
integer = "int"
nothing = "None"
optional = "{= type =} | None"
param = "{= name =}: {= type =}"
annotation = '{= name =}:[[:space:]]*([^,)=]+)'
returns = '->(.*)$'
assigned = '^[[:space:]]*([[:alnum:]_]+)[[:space:]]*=[^=]'
checks_none = ['{= name =} is None', '{= name =} is not None']
record = '^class {= name =}[(:]'
method = "{= name =}(self{= params =}) -> {= returns =}"
