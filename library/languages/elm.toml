# Elm: tree-sitter-elm, read in process by olifant's queries (library/queries/elm)
# and by ast-grep; checks with `elm make`. The grammar is not shipped: the elm
# pack carries its sources (grammar = { source }).
files = ["**/*.elm"]
# Folders a project listing never enters: elm's cache, a front end's packages.
ignore = ["elm-stuff", "node_modules"]
# What a unit is, as prompts say it (an anchor @path:Unit).
unit_words = "a top-level function or type name (Name)"
comment = "--"
placeholder = 'Debug.todo "{= message =}"'
branch = """
{= pattern =} ->
    {= body =}"""
# After a case's only branch, a new one goes after a blank line (elm-format's).
lone_arm_spaced = true

# Hole kinds (spec §6.3): the unfilled placeholder (must compile) and the code
# a fill must parse in.
[holes.expr]
placeholder = 'Debug.todo "olifant: {= hole =}: {= instruction|escaped =}"'
wrap = """
olifantHole =
    {= fill =}
"""

[check]
command = ["elm", "make", "{= files =}", "--report=json", "--output=/dev/null"]
context = ["elm.json"]
format = "elm-json"
# elm make crashes when several run at once under load: one at a time
concurrent = false
install = "npm install -g elm (or brew install elm)"

# `type NAME`, `record NAME`, `function NAME` and `imports` are the generic
# phrases (library/queries/elm); these two are relations no capture names.
[targets.case_in]
phrase = "case in FUNCTION"
container = { kind = "case_of_expr", inside = { kind = "value_declaration", regex = "^{= FUNCTION =}\\b", stopBy = "end" }, not = { inside = { kind = "case_of_expr", stopBy = "end" } } }
items = { kind = "case_of_branch", not = { regex = "^(_|\\(\\s*_\\s*(,\\s*_\\s*)*\\))\\s*->" } }
example = "end of case in update"

[targets.list_in]
phrase = "list in FUNCTION"
container = { kind = "list_expr", inside = { kind = "value_declaration", regex = "^{= FUNCTION =}\\b", stopBy = "end" }, not = { inside = { kind = "list_expr", stopBy = "end" } } }
# ast-grep needs a kind: every expression kind a list element can be (tree-sitter-elm exprList).
items = { any = [
  { kind = "anonymous_function_expr" },
  { kind = "bin_op_expr" },
  { kind = "case_of_expr" },
  { kind = "char_constant_expr" },
  { kind = "field_access_expr" },
  { kind = "field_accessor_function_expr" },
  { kind = "function_call_expr" },
  { kind = "glsl_code_expr" },
  { kind = "if_else_expr" },
  { kind = "let_in_expr" },
  { kind = "list_expr" },
  { kind = "negate_expr" },
  { kind = "number_constant_expr" },
  { kind = "operator_as_function_expr" },
  { kind = "parenthesized_expr" },
  { kind = "record_expr" },
  { kind = "string_constant_expr" },
  { kind = "tuple_expr" },
  { kind = "unit_expr" },
  { kind = "value_expr" },
] }
example = "end of list in parser"

# The unit: the innermost definition at the cursor (from the grammar's
# queries: a function, a type, a type alias) is what `conjure` conjures and
# `stub` stubs a test for.
[unit]
# `name` finds a unit's definition line (units are named by the queries' @name).
name = ["^type[[:space:]]+alias[[:space:]]+([[:alnum:]_]+)", "^type[[:space:]]+([[:alnum:]_]+)", "^[[:space:]]*([[:alpha:]_][[:alnum:]_']*)"]
