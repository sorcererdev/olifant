# Haskell: ast-grep's built-in grammar; checks with GHC's JSON diagnostics
# through `cabal repl` (spec §5.6): type-checks the library (-fno-code)
# without linking, so a clean check exits 0.
files = ["**/*.hs"]
# What a unit is, as prompts say it (an anchor @path:Unit).
unit_words = "a top-level function, type or class name (Name), or a name bound in its where (function.name)"
comment = "--"
grammar = "haskell"
indent = "  "
placeholder = 'error "{= message =}"'
branch = "{= pattern =} -> {= body =}"
# After a case's only alternative, a new one goes after a blank line.
lone_arm_spaced = true

# Imports: a Spec imports its module whole (`import Olifant.Plans`); a
# path's module is its folders and name, less `src/` or `test/`, dotted.
[imports]
write = "import {= module =}"
module_of = { strip = ["^src/", "^test/"], separator = "." }

[targets.data]
phrase = "data NAME"
container = { kind = "data_constructors", inside = { kind = "data_type", regex = "^data {= NAME =}\\b" } }
items = { kind = "data_constructor" }
example = "end of data CatalogError"

[check]
# `cabal repl` over the package's library, -fno-code, its builddir kept in
# Olifant's cache (a slot per check: exclusive)
preset = "cabal-repl"

# Tests: hspec through `cabal test --format=checks`; one test by its
# describe path (--match), a module's tests beside it as <Module>Spec.hs
[test]
preset = "hspec"

# Hole kinds (spec §6.3): the unfilled placeholder (must compile) and the code
# a fill must parse in.
[holes.expr]
placeholder = 'error "olifant: {= hole =}: {= instruction|escaped =}"'
wrap = "olifantHole = {= fill =}"

# Tab stops in snippets (spec §4.9): text inside a string.
[holes.text]
placeholder = "{= hole =}"
wrap = "olifantHole = \"{= fill =}\""

# The unit: the innermost of these node kinds at the cursor is what `conjure`
# conjures and `stub` stubs a test for.
[unit]
kinds = ["signature", "function", "bind", "data_type", "newtype", "class", "instance"]
# A function is its signature and its equations: units of one name, at one
# indentation, with only blank lines between, are one.
join = true
# The name: a type's or class's second word, an instance's head, an
# operator in brackets, else the first word.
name = [
  "^(data|newtype|type|class)[[:space:]]+([^[:space:]]+)",
  "^instance[[:space:]]+(.*[^[:space:]])[[:space:]]+where[[:space:]]*$",
  "^instance[[:space:]]+(.*[^[:space:]])",
  "^[[:space:]]*(\\([^)]*\\))",
  "^[[:space:]]*([[:alpha:]_][[:alnum:]_']*)",
]
