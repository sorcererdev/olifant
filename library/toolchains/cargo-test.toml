# `cargo test` in the file's crate (the nearest Cargo.toml), its target dir
# in Olifant's cache (a slot per run: exclusive), read by `lines` over
# libtest's `test <path> ... ok|FAILED` lines and its `---- <path> stdout
# ----` failure blocks. A test is its module path (`rates::tests::adds`):
# one runs by `--exact`, a file's by its module (`rates::`). Tests live in
# the source file, in its `mod tests`.
[test]
command = ["cargo", "test", "--target-dir", "{= cache =}/test-target-{= context =}", "--", "{= tests =}"]
context = ["**/Cargo.toml", "Cargo.lock"]
format = "lines"
root = ["Cargo.toml"]
exclusive = true
timeout = 900
tests_for = "{= dir =}/{= stem =}.rs"
install = "install Rust with rustup; cargo lives in ~/.cargo/bin, or /opt/homebrew/opt/rustup/bin with Homebrew's rustup (keg-only: add it to PATH, then restart your editor from a new shell)"
# A new test: a #[test] fn named by its words in snake case, red until
# written (todo!), at the end of the file's `mod tests`, opened when there
# is none; `mod tests;` (tests in tests.rs) is refused.
name = "{= words|snake =}"

[test.lines]
pass = '^test (.+) \.\.\. ok$'
fail = '^test (.+) \.\.\. FAILED$'
split = "::"
failure = 'panicked at ([^ ]+):([0-9]+):[0-9]+:$'
end = '^failures:$'
drop = '^---- .* stdout ----$|^note: run with'

[test.select]
test = ["--exact", "{= if group =}{= group =}::{= end =}{= name =}"]
file = "{= if group =}{= group =}::{= end =}"
join = "::"

[test.stub]
test = """
{= indent =}#[test]
{= indent =}fn {= name =}() {
{= note =}{= indent =}{= indent =}todo!("write this test");
{= indent =}}
"""
at = "end of mod tests"
open = """
#[cfg(test)]
mod tests {
    use super::*;

{= test =}}
"""
elsewhere = '^[[:space:]]*(pub[^[:space:]]*[[:space:]]+)?mod[[:space:]]+(tests)[[:space:]]*;'
gap = 1
