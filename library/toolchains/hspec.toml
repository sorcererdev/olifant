# hspec through `cabal test`. When a *.cabal or package.yaml names
# hspec-junit-formatter (hooked through Formatter.Env, see the book) the run
# writes JUnit to {= report =} and `junit-xml` reads it; otherwise
# `--format=checks` is read by `lines`. One test by its describe path
# (--match); a module's tests beside it as <Module>Spec.hs.
[test]
command = [
  { when = ["*.cabal", "package.yaml"], has = "hspec-junit-formatter", format = "junit-xml", command = ["env", "JUNIT_ENABLED=1", "JUNIT_OUTPUT_FILE={= report =}", "cabal", "test", "-v0", "--builddir={= cache =}/dist-test-{= context =}", "--test-show-details=direct", "--test-option=--no-color", "{= tests =}"] },
  { command = ["cabal", "test", "-v0", "--builddir={= cache =}/dist-test-{= context =}", "--test-show-details=direct", "--test-option=--format=checks", "--test-option=--no-color", "{= tests =}"] },
]
context = ["*.cabal", "cabal.project", "cabal.project.freeze"]
format = "lines"
# a describe or an it: its name is the string's (group 3), escapes and all
unit = [{ pattern = '(^|[[:space:]$])(describe|context|it|specify|prop)[[:space:]]+"(([^"\\]|\\.)*)"', name = 3 }]
file_group = "^module[[:space:]]+([[:alnum:]_.]+)Spec"
exclusive = true
timeout = 900
tests_for = "{= dir =}/{= stem =}Spec.hs"
install = "install with ghcup; it lives in ~/.ghcup/bin"
# A new test: an `it` named by its words, red until written
# (expectationFailure), one blank line before it; a new Spec module imports
# its module and describes it by name.
name = "{= words|lower_words =}"

# hspec's `--format=checks` tree
[test.lines]
pass = "^[[:space:]]*(.*[^[:space:]]) \\[✔\\]$"
fail = "^[[:space:]]*(.*[^[:space:]]) \\[✘\\]$"
nest = true
failure = "^  ([^[:space:]].*):([0-9]+):[0-9]+: *$"
end = "^  To rerun use|^Randomized with seed|^Finished in"
drop = "^  [0-9]+\\) "

# hspec-junit-formatter: classname is the describe path joined by `/`
[test.junit]
join = "/"

[test.select]
test = "--test-option=--match=/{= group =}/{= name =}/"
file = "--test-option=--match=/{= group =}/"

[test.stub]
test = """
{= indent =}it "{= name|escaped =}" $ do
{= note =}{= indent =}{= indent =}expectationFailure "write this test"
"""
at = "end of do in spec"
file = """
module {= module =}Spec (spec) where

{= import =}
import Test.Hspec

spec :: Spec
spec = describe "{= module =}" $ do
"""
gap = 1
