# pytest as the project runs it, the first that fits under the package
# root: with a uv.lock, through uv, its venv in Olifant's cache as
# pyright's; else the project's own venv (.venv or venv, by its path:
# the run is in a scratch copy, {= root =} the package folder); else
# pytest from PATH. A module's tests beside it as test_<module>.py unless
# the language says otherwise.
[test]
command = [
  { when = ["uv.lock"], context = ["pyproject.toml", "uv.lock"], command = ["env", "UV_PROJECT_ENVIRONMENT={= cache =}/venv-{= context =}", "uv", "run", "--quiet", "--frozen", "pytest", "-q", "--tb=short", "-p", "no:cacheprovider", "{= tests =}", "-o", "junit_family=xunit1", "--junitxml={= report =}"] },
  { when = [".venv/bin/pytest"], command = ["{= root =}/.venv/bin/pytest", "-q", "--tb=short", "-p", "no:cacheprovider", "{= tests =}", "-o", "junit_family=xunit1", "--junitxml={= report =}"] },
  { when = ["venv/bin/pytest"], command = ["{= root =}/venv/bin/pytest", "-q", "--tb=short", "-p", "no:cacheprovider", "{= tests =}", "-o", "junit_family=xunit1", "--junitxml={= report =}"] },
  { command = ["pytest", "-q", "--tb=short", "-p", "no:cacheprovider", "{= tests =}", "-o", "junit_family=xunit1", "--junitxml={= report =}"] },
]
# pytest's JUnit report (xunit1: its testcases carry `file` and `line`; the
# default xunit2 has neither), written where {= report =} says. A project's own
# `command` that names no {= report =} (an addopts recipe, `-rA` and all) keeps
# reading the console as before: `console_format` stands in for `format`.
format = "junit-xml"
console_format = "pytest"
context = ["pyproject.toml"]
root = ["pyproject.toml"]
tests_for = "{= dir =}/test_{= stem =}.py"
install = "with uv: brew install uv (pytest comes with the project: `uv sync`); else pytest in the project's venv (`pip install pytest`)"
# Its words for a name not defined (a summary says NameError).
undefined = [{ pattern = "name '([^']+)' is not defined", label = "NameError" }]
# Tests by rule: a `test…` function (async too); decorators belong to the
# def below. A method's class comes from the grammar (any class holding a
# test, `ElectionTests(TestCase)` as `TestX`): its id is `Class::test_y`.
unit = [
  '^[[:space:]]*(async[[:space:]]+)?def[[:space:]]+(test[[:alnum:]_]*)[[:space:]]*\(',
]
above = '^[[:space:]]*@'
# A test's id is pytest's own (`path::Class::test_name`): passed as it is.
select = { test = "{= id =}", file = "{= id =}" }
# A new test: `test_` and its words in snake case; its body `...` and
# `assert ...`, two blank lines before it; a new file starts with the unit's
# import.
name = "test_{= words|snake =}"

[test.junit]
join = "."

[test.stub]
test = "def {= name =}() -> None:\n{= note =}{= indent =}...\n{= indent =}assert ...\n"
file = "{= import =}\n\n\n"
gap = 2

# A failure's section: the failing source line follows `…: in NAME`; the
# message's first line less `AssertionError: `; what came back and what was
# expected, from `assert A == B` and from isinstance's `where` line.
[test.failure]
line_after = ': in {= name =}$'
head_strip = '^AssertionError: '
# a first line that says nothing gives way to the first `+  where` line
bare = ['^assert False$', '^assert None$', '^AssertionError$']
explain = '^\+  where (.*)$'
got_expected = [
  { pattern = '^assert (([^=]|=[^=])*[^= ]) == (.*)$', got = 1, expected = 3 },
  { pattern = '^\+  where False = isinstance\((.*), ([^,]*)\)$', got = 1, expected = 2 },
]
